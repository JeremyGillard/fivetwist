name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Lint the bindings for WebAssembly
        run: cargo clippy -p pentago-wasm --all-targets --target wasm32-unknown-unknown -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Test the bindings in Node
        run: wasm-pack test --node crates/pentago-wasm

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
      - name: Build the WebAssembly package
        run: npm run wasm
      - name: Format
        run: npm run check:format
      - name: Lint
        run: npm run check:lint
      - name: Type-check
        run: npm run type-check
      - name: Unit tests
        run: npm run test:unit -- --run

      - name: Install the browsers
        run: npx playwright install --with-deps
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Keep the traces of failed end-to-end tests
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7

      # The site is served from https://<owner>.github.io/<repository>/, not from the root.
      - name: Build the site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run build-only -- --base=/${{ github.event.repository.name }}/
      - name: Upload the site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust, web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
